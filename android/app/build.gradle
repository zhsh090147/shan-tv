plugins {
    id 'com.android.application'
}
android {
    namespace 'com.zhshan.shantv'
    compileSdk 35
    defaultConfig {
        applicationId "com.zhshan.shantv"
        minSdk 21
        targetSdk 35
        versionCode 23
        versionName "1.0.23"
    }
    signingConfigs {
        release {
            def ks = rootProject.file('app/shantv-fixed.keystore')
            if (ks.exists()) {
                storeFile ks
                storeType 'PKCS12'
                storePassword 'shantv2026'
                keyAlias 'shantv'
                keyPassword 'shantv2026'
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (rootProject.file('app/shantv-fixed.keystore').exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
}
